<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa em Dia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa em Dia">
<meta name="theme-color" content="#1F9BB5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A5A; --ink-soft:#4A5580; --paper:#F4F7FF; --card:#FFFFFF; --line:#DCE3F5;
  --coin:#FFC23C; --coin-deep:#E09A00; --leaf:#2E9E6A; --leaf-bg:#E3F5EC;
  --wait:#8A6DD8; --wait-bg:#EEE8FB; --no:#D9534F;
  --maria:#FF6F8A; --maria-bg:#FFE6EB; --joao:#1F9BB5; --joao-bg:#DDF3F8; --pais:#1E2A5A; --pais-bg:#E4E8F5;
  --kid:var(--maria); --kid-bg:var(--maria-bg);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEF1FF; --ink-soft:#AEB6D6; --paper:#12172E; --card:#1C2342; --line:#2E3760;
    --leaf-bg:#173A2C; --wait-bg:#2B2550; --maria-bg:#40202B; --joao-bg:#123A45; --pais-bg:#2A3258; --pais:#C9D1F5;
  }
}
:root[data-theme="dark"]{
  --ink:#EEF1FF; --ink-soft:#AEB6D6; --paper:#12172E; --card:#1C2342; --line:#2E3760;
  --leaf-bg:#173A2C; --wait-bg:#2B2550; --maria-bg:#40202B; --joao-bg:#123A45; --pais-bg:#2A3258; --pais:#C9D1F5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,.display{font-family:"Baloo 2",Nunito,system-ui,sans-serif;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 48px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 14px}
.brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .dot{width:26px;height:26px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -3px 0 var(--coin-deep);display:grid;place-items:center;font-size:.85rem;color:#6B4700}
.who{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:999px}
.who button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:800;color:var(--ink-soft)}
.who button[aria-pressed="true"]{background:var(--kid-bg);color:var(--kid)}

/* cofrinho */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:18px}
.hello h1{font-size:2.3rem;font-weight:800;color:var(--kid)}
.hello p{margin:2px 0 0;color:var(--ink-soft);font-weight:600}
.bank{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.coin{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,var(--coin) 55%,var(--coin-deep));box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;color:#6B4700;font-size:1.6rem}
.coin.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.15) rotate(-8deg)}}
@media (prefers-reduced-motion: reduce){.coin.pop{animation:none}}
.bank .amount{font-family:"Baloo 2";font-weight:800;font-size:2.4rem;line-height:1}
.bank .label{color:var(--ink-soft);font-weight:700;font-size:.95rem}
.goal{margin-top:8px}
.bar{height:12px;background:var(--paper);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--coin);border-radius:99px;transition:width .4s}
.goal small{display:block;margin-top:4px;color:var(--ink-soft);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:var(--kid-bg);border-radius:20px;padding:12px 16px}
.stat b{font-family:"Baloo 2";font-size:1.7rem;font-weight:800;color:var(--kid);display:block;line-height:1.1}
.stat span{font-weight:700;font-size:.9rem;color:var(--ink-soft)}

/* abas */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:800;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--kid);border-bottom-color:var(--kid)}

/* tarefas */
.moment{margin:18px 0 8px;font-family:"Baloo 2";font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.moment span{font-size:.9rem;font-family:Nunito;font-weight:700;color:var(--ink-soft)}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.task .ic{width:40px;height:40px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font-size:1.3rem}
.task .t{font-weight:700;line-height:1.3}
.task .r{font-size:.82rem;color:var(--ink-soft);font-weight:700}
.task.done{border-color:var(--leaf);background:var(--leaf-bg)}
.task.great{border-color:var(--coin-deep)}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:800;background:var(--kid);color:#fff;min-height:44px}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.wait{background:var(--wait-bg);color:var(--wait)}
.btn.ok{background:var(--leaf);color:#fff}
.btn.gold{background:var(--coin);color:#5A3C00}
.btn.no{background:transparent;color:var(--no);border:2px solid var(--line)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.badge{font-weight:800;font-size:.9rem;padding:8px 12px;border-radius:12px;white-space:nowrap}
.badge.ok{background:var(--leaf);color:#fff}
.badge.gold{background:var(--coin);color:#5A3C00}
.badge.no{background:var(--paper);color:var(--ink-soft)}

/* diário */
.moods{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.moods button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;font-size:1.7rem;line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.moods button small{font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.moods button[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg)}
label.f{display:block;font-weight:800;margin:14px 0 6px}
textarea,input[type=text],input[type=number],input[type=password],select{width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.note{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;color:var(--ink-soft);font-weight:600;font-size:.95rem}

/* painel */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{font-size:1.2rem;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.pend{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pend:first-of-type{border-top:0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:800;font-size:.8rem}
.chip.maria{background:var(--maria-bg);color:var(--maria)}
.chip.joao{background:var(--joao-bg);color:var(--joao)}
.diary-entry{border-top:1px solid var(--line);padding:12px 0}
.diary-entry:first-child{border-top:0}
.diary-entry p{margin:4px 0}
.diary-entry .q{font-weight:800;font-size:.85rem;color:var(--ink-soft);margin-top:8px}
.muted{color:var(--ink-soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--paper);color:var(--ink-soft)}
.cal .l1{background:var(--kid-bg);color:var(--kid)}
.cal .l2{background:var(--kid);color:#fff}
.cal .today{outline:2px solid var(--ink)}
.cal .h{background:none;aspect-ratio:auto;font-size:.75rem}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-size:.95rem}
th{font-size:.8rem;color:var(--ink-soft);border-top:0}
.welcome{text-align:center;padding:40px 16px}
.welcome h1{font-size:2.4rem;margin-bottom:10px}
.welcome p{max-width:46ch;margin:0 auto 20px;color:var(--ink-soft);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:14px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.save-state{font-size:.8rem;color:var(--ink-soft);font-weight:700;text-align:center;margin-top:28px}
.hidden{display:none!important}
@media (max-width:520px){
  .hello h1{font-size:1.9rem}
  .bank .amount{font-size:2rem}
  .coin{width:68px;height:68px;font-size:1.3rem}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 > :first-child{grid-column:1/-1}
}
.bank .amount .of{font-size:1rem;color:var(--ink-soft);font-family:Nunito;font-weight:700}
.exp{padding:12px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp-t{font-weight:700;margin:0 0 8px;line-height:1.35}
.rate{font-weight:700;font-size:.9rem}
.hope{margin:8px 0;font-weight:600}
h4.sub{margin:16px 0 4px}
.amount-sm{font-family:"Baloo 2";font-weight:800;font-size:1.8rem;margin:0 0 6px}
.ext-day{border-top:1px solid var(--line);padding:10px 0}
.ext-day:first-of-type{border-top:0;padding-top:0}
.ext-h{display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px}
.ext-h b{color:var(--leaf)}
.ext-l{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--ink-soft);font-weight:600;margin:2px 0}
.ext-l span:last-child{white-space:nowrap}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.medal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center}
.medal.got{border:2px solid var(--coin);background:var(--kid-bg)}
.medal-ic{font-size:2.2rem;line-height:1.2}
.medal:not(.got) .medal-ic{opacity:.5}
.medal-n{font-weight:800;font-size:.9rem;line-height:1.3;margin:6px 0}
.medal-p{font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-top:4px}
.bar.sm{height:8px}
.mission{display:flex;gap:12px;align-items:center;background:var(--card);border:2px dashed var(--coin);border-radius:20px;padding:12px 14px;margin-top:14px}
.mission.done{border-style:solid;border-color:var(--leaf)}
.mission-ic{font-size:2rem}
.mission-l{font-size:.82rem;font-weight:800;color:var(--ink-soft)}
.mission-t{font-weight:800;font-size:1.05rem}
.talk-btn{background:var(--card);color:var(--kid);border:2px solid var(--kid)}
.talk-opts{display:grid;gap:8px}
.talk-opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:700}
.talk-opt[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg)}
.choice{border:2px solid var(--coin)}
.alert{display:block;width:100%;text-align:left;border:0;background:var(--wait-bg);color:var(--wait);font-weight:800;padding:12px 16px;border-radius:16px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot">R$</span>Casa em Dia</div>
    <nav class="who" id="who" aria-label="Quem está usando"></nav>
  </header>
  <main id="app"><p class="muted">Carregando…</p></main>
  <p class="save-state" id="saveState"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== Configuração ===================== */
const KIDS=["maria","joao"];
const CATS = {
  rotina:{ic:"⏰",n:"Rotina"}, higiene:{ic:"🛁",n:"Higiene"}, refeicao:{ic:"🍽️",n:"Refeições"},
  estudo:{ic:"📚",n:"Estudos"}, leitura:{ic:"📖",n:"Leitura"}, organizacao:{ic:"🧺",n:"Organização"},
  limpeza:{ic:"🧽",n:"Limpeza"}, convivencia:{ic:"💛",n:"Convivência"}, curso:{ic:"🎓",n:"Cursos"}
};
const MOMENTS = [
  {id:"manha",n:"Manhã",ic:"🌅"},{id:"tarde",n:"Depois da escola",ic:"🎒"},
  {id:"noite",n:"Noite",ic:"🌙"},{id:"dia",n:"O dia todo",ic:"✨"}
];
const MOODS = [["😄","Muito feliz"],["🙂","Bem"],["😐","Mais ou menos"],["😢","Triste"],["😠","Bravo(a)"],["😰","Preocupado(a)"]];
const RATES = {otimo:{ic:"🌟",n:"Mandou muito bem"}, quase:{ic:"👍",n:"Quase lá"}, melhorar:{ic:"💪",n:"Vamos melhorar"}};
const TALK_LEVELS={importante:{ic:"🔴",n:"Preciso conversar sobre algo importante"},contar:{ic:"🟡",n:"Quero contar uma coisa"},legal:{ic:"🟢",n:"Quero compartilhar algo legal"}};
const MISSION_IDEAS=["🍕 Fazer um jantar juntos","🎬 Noite do filme com pipoca","🚶 Caminhar juntos na praia ou no parque","🎲 Noite de jogos de tabuleiro","🍰 Fazer uma receita juntos","🧹 Organizar um cômodo da casa juntos","🌱 Plantar ou cuidar de plantas juntos","📸 Passeio em família sem celular"];
const MONTHS_PT=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const monthName=mk=>{const [y,m]=mk.split("-").map(Number);return `${MONTHS_PT[m-1]} de ${y}`};
let uid=0; const tid=()=>"t"+Date.now().toString(36)+(uid++);

const DEFAULT_SETTINGS={pin:"1234", monthlyMax:100, pointsDone:2, pointsGreat:3, diaryPoints:2, completeBonus:30, greatScreenPct:50};
const DEFAULT_EXPECT=[
  "Tratar todos com respeito: sem gritos, sem xingamentos e sem bater.",
  "Pedir desculpas quando errar e aceitar as desculpas do outro.",
  "Cuidar das próprias coisas e das coisas dos outros.",
  "Falar a verdade, mesmo quando for difícil.",
  "Ajudar em casa sem precisar pedir várias vezes.",
  "Contar para os pais quando algo estiver errado ou preocupando.",
  "Respeitar o tempo de tela combinado e desligar sem briga."
];

function suggestions(){
  const t=(title,cat,time,minutes)=>({id:tid(),title,cat,time,minutes});
  return {
    kids:{
      maria:{name:"Maria",age:8,baseScreen:60,maxScreen:120,goal:"Kit de pintura"},
      joao:{name:"João",age:12,baseScreen:60,maxScreen:120,goal:"Jogo novo"}
    },
    tasks:{
      maria:[
        t("Acordar no horário, sem precisar chamar duas vezes","rotina","manha",10),
        t("Arrumar a cama","organizacao","manha",5),
        t("Escovar os dentes e se arrumar sozinha","higiene","manha",5),
        t("Fazer a lição de casa","estudo","tarde",10),
        t("Ler por 20 minutos","leitura","tarde",10),
        t("Guardar os brinquedos depois de brincar","organizacao","tarde",5),
        t("Comer sentada à mesa, sem tela","refeicao","dia",5),
        t("Levar o prato para a pia e limpar o que sujou","limpeza","dia",5),
        t("Falar por favor, obrigada e tratar o João com carinho","convivencia","dia",10),
        t("Tomar banho na hora combinada, sem reclamar","higiene","noite",5),
        t("Arrumar a mochila e separar a roupa de amanhã","organizacao","noite",5),
        t("Praticar o curso (inglês, música…) por 15 min","curso","tarde",10)
      ],
      joao:[
        t("Acordar sozinho no horário","rotina","manha",10),
        t("Arrumar a cama","organizacao","manha",5),
        t("Escovar os dentes e se arrumar sem precisar lembrar","higiene","manha",5),
        t("Estudar ou fazer as tarefas da escola","estudo","tarde",10),
        t("Ler por 30 minutos","leitura","tarde",10),
        t("Deixar o quarto arrumado","organizacao","tarde",5),
        t("Refeições à mesa, sem celular","refeicao","dia",5),
        t("Lavar a louça que usou e limpar o que sujou","limpeza","dia",5),
        t("Ser gentil com a Maria e com todos da família","convivencia","dia",10),
        t("Banho na hora combinada","higiene","noite",5),
        t("Organizar a mochila e separar a roupa de amanhã","organizacao","noite",5),
        t("Fazer 30 min de um curso online ou extra","curso","tarde",10)
      ]
    },
    settings:{...DEFAULT_SETTINGS},
    expectations:DEFAULT_EXPECT.map(text=>({id:tid(),text,for:"ambos"})),
    accepted:{maria:{},joao:{}}, ratings:{}, hopes:{maria:[],joao:[]},
    log:{}, diary:{}, bonus:[], months:{},
    talks:[], missions:{}, savings:{maria:0,joao:0}, savingsLog:[]
  };
}
function migrate(s){
  if(!s) return s;
  s.settings={...DEFAULT_SETTINGS,...s.settings};
  delete s.settings.capricho; delete s.settings.diaryValue; delete s.settings.diaryMinutes;
  for(const k of KIDS){
    const kd=s.kids[k]; if(kd.goal&&typeof kd.goal==="object") kd.goal=kd.goal.name||"Presente";
    s.tasks[k].forEach(t=>delete t.value);
  }
  s.bonus=(s.bonus||[]).map(b=>({kid:b.kid,date:b.date,minutes:b.minutes||0,reason:b.reason}));
  if(!s.expectations) s.expectations=DEFAULT_EXPECT.map(text=>({id:tid(),text,for:"ambos"}));
  s.accepted=s.accepted||{maria:{},joao:{}}; s.ratings=s.ratings||{}; s.hopes=s.hopes||{maria:[],joao:[]};
  s.months=s.months||{}; s.talks=s.talks||[]; s.missions=s.missions||{};
  s.savings=s.savings||{maria:0,joao:0}; s.savingsLog=s.savingsLog||[];
  return s;
}

/* ===================== Utilidades ===================== */
const $=s=>document.querySelector(s);
const money=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseDay=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const fmtDay=k=>parseDay(k).toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"});
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d)};
const weekKey=(d=new Date())=>{const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return dkey(x)};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2400)}

/* ===================== Armazenamento ===================== */
let state=null;
let view={who:"maria", tab:"tarefas", ptab:"aprovar", unlocked:false, editKid:"maria"};
const LS="casa-em-dia-v1";
function loadLocal(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function persist(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){toast("Não foi possível salvar neste navegador.")}}
function commit(fn){fn(state);render();persist()}
function setSaveState(){ $("#saveState").textContent="Os dados ficam salvos neste aparelho. Faça um backup de vez em quando em Mês e ajustes."; }

/* ===================== Cálculos ===================== */
// Pontos: cada tarefa vale 2 pontos (feito) ou 3 (com capricho). O diário vale 2.
// Dinheiro do mês = teto × pontos ganhos ÷ pontos possíveis no mês.
// Tudo feito com capricho, todos os dias = R$ 100. Os dois têm sempre o mesmo teto.
const statusOf=(kid,day,id)=>(((state.log[day]||{})[kid]||{})[id]);
const hasDiary=(kid,day)=>{const d=(state.diary[day]||{})[kid];return !!(d&&d.did&&d.did.trim())};
function dayPoints(kid,day){
  const s=state.settings; let p=0;
  for(const t of state.tasks[kid]){const st=statusOf(kid,day,t.id); if(st==="done")p+=s.pointsDone; else if(st==="great")p+=s.pointsGreat}
  if(hasDiary(kid,day)) p+=s.diaryPoints;
  return p;
}
const maxDayPoints=kid=>state.tasks[kid].length*state.settings.pointsGreat+state.settings.diaryPoints;
function daysIn(mk){const [y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate()}
function monthMoney(kid,mk=mkey()){
  let pts=0; const days=new Set([...Object.keys(state.log),...Object.keys(state.diary)]);
  for(const d of days) if(d.startsWith(mk)) pts+=dayPoints(kid,d);
  const max=daysIn(mk)*maxDayPoints(kid);
  return Math.min(state.settings.monthlyMax, max?state.settings.monthlyMax*pts/max:0);
}
const dayMoney=(kid,day)=>{const max=daysIn(day.slice(0,7))*maxDayPoints(kid);return max?state.settings.monthlyMax*dayPoints(kid,day)/max:0};
const perfectDayMoney=kid=>state.settings.monthlyMax/daysIn(mkey());
function dayComplete(kid,day){
  if(!state.tasks[kid].length) return false;
  return state.tasks[kid].every(t=>["done","great"].includes(statusOf(kid,day,t.id))) && hasDiary(kid,day);
}
function screenToday(kid){
  const k=state.kids[kid], day=dkey(), s=state.settings; let earned=0;
  for(const t of state.tasks[kid]){const st=statusOf(kid,day,t.id); if(st==="done")earned+=t.minutes; else if(st==="great")earned+=Math.round(t.minutes*(1+s.greatScreenPct/100))}
  const normal=Math.min(k.baseScreen+earned,k.maxScreen);
  const complete=dayComplete(kid,yesterday())?s.completeBonus:0;
  const manual=state.bonus.filter(b=>b.kid===kid&&b.date===day).reduce((a,b)=>a+b.minutes,0);
  return {base:k.baseScreen, earned, normal, complete, manual, total:normal+complete+manual};
}
function pendingList(){
  const out=[];
  for(const day of Object.keys(state.log).sort().reverse()) for(const kid of KIDS){
    const l=(state.log[day]||{})[kid]||{};
    for(const [id,st] of Object.entries(l)) if(st==="pending"){const task=state.tasks[kid].find(t=>t.id===id); if(task) out.push({day,kid,task})}
  }
  return out;
}
function itemMoney(kid,day,st){
  const s=state.settings, max=daysIn(day.slice(0,7))*maxDayPoints(kid);
  const p=st==="great"?s.pointsGreat:st==="done"?s.pointsDone:st==="diary"?s.diaryPoints:0;
  return max?s.monthlyMax*p/max:0;
}
function allDays(){return [...new Set([...Object.keys(state.log),...Object.keys(state.diary)])].sort()}
function kidStats(kid){
  const cat={}, st={great:0,diaries:0,complete:0,best:0};
  const days=allDays(); let run=0, prev=null;
  for(const d of days){
    const seen=new Set();
    for(const t of state.tasks[kid]){const x=statusOf(kid,d,t.id); if(x==="done"||x==="great"){seen.add(t.cat); if(x==="great")st.great++}}
    seen.forEach(c=>cat[c]=(cat[c]||0)+1);
    if(hasDiary(kid,d)) st.diaries++;
    if(dayComplete(kid,d)){
      st.complete++;
      const consecutive=prev&&(parseDay(d)-parseDay(prev))/864e5===1;
      run=consecutive?run+1:1; prev=d; st.best=Math.max(st.best,run);
    }
  }
  st.cat=cat;
  st.missions=Object.values(state.missions).filter(m=>m.done).length;
  st.saved=Object.values(state.months).filter(m=>m[kid]&&m[kid].saved>0).length;
  return st;
}
const MEDALS=[
  {ic:"🌟",n:"Primeiro dia completo",goal:1,v:s=>s.complete},
  {ic:"🔥",n:"3 dias completos seguidos",goal:3,v:s=>s.best},
  {ic:"🏆",n:"7 dias completos seguidos",goal:7,v:s=>s.best},
  {ic:"⏰",n:"Pontual: 7 dias acordando no horário",goal:7,v:s=>s.cat.rotina||0},
  {ic:"📖",n:"Leitor: 10 dias de leitura",goal:10,v:s=>s.cat.leitura||0},
  {ic:"📚",n:"Estudioso: 10 dias de estudo",goal:10,v:s=>s.cat.estudo||0},
  {ic:"🎓",n:"Aprendiz: 5 dias de curso",goal:5,v:s=>s.cat.curso||0},
  {ic:"🧺",n:"Organizado: 15 dias organizando",goal:15,v:s=>s.cat.organizacao||0},
  {ic:"🧽",n:"Quem suja, limpa: 10 dias",goal:10,v:s=>s.cat.limpeza||0},
  {ic:"💛",n:"Gentileza: 7 dias",goal:7,v:s=>s.cat.convivencia||0},
  {ic:"⭐",n:"Caprichoso: 20 tarefas com capricho",goal:20,v:s=>s.great},
  {ic:"📝",n:"Contador de histórias: 7 diários",goal:7,v:s=>s.diaries},
  {ic:"👨‍👩‍👧‍👦",n:"Família unida: 3 missões",goal:3,v:s=>s.missions},
  {ic:"🐷",n:"Poupador: guardou dinheiro",goal:1,v:s=>s.saved}
];
const openTalks=()=>state.talks.filter(t=>!t.done);
const expFor=kid=>state.expectations.filter(e=>e.for==="ambos"||e.for===kid);
const lastRating=(kid,id)=>{for(const w of Object.keys(state.ratings).sort().reverse()){const r=((state.ratings[w]||{})[kid]||{})[id]; if(r) return {w,r}} return null};

  const hour=new Date().getHours(); const hi=hour<12?"Bom dia":hour<18?"Boa tarde":"Boa noite";
  const l=(state.log[today]||{})[kid]||{};
  const pending=expFor(kid).filter(e=>!state.accepted[kid][e.id]).length;
  let body="";
  if(view.tab==="tarefas"){
    const complete=dayComplete(kid,today);
    body=`<p class="note">Cada tarefa vale ${s.pointsDone} pontos, ou ${s.pointsGreat} se for feita com capricho. ${complete?`<b>Dia completo! Amanhã você ganha +${s.completeBonus} min de tela bônus 🎉</b>`:`Faça tudo e escreva o diário para ganhar +${s.completeBonus} min de tela bônus amanhã.`}</p>`+
    missionCardHTML()+MOMENTS.map(m=>{const ts=state.tasks[kid].filter(t=>t.time===m.id); if(!ts.length) return "";
      return `<h2 class="moment">${m.ic} ${m.n}</h2>`+ts.map(t=>taskRow(t,l[t.id])).join("")}).join("");
  } else if(view.tab==="combinados") body=kidExpectHTML(kid);
  else if(view.tab==="conquistas") body=medalsHTML(kid);
  else if(view.tab==="diario") body=diaryHTML(kid,today);
  else body=monthHTML(kid);
  return `
  <section class="hero"><div class="hello"><h1>${hi}, ${esc(k.name)}!</h1><p>${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</p></div></section>
  <section class="bank" aria-label="Meu cofrinho">
    <div class="coin" id="coin">R$</div>
    <div><div class="label">Meu cofrinho este mês</div>
      <div class="amount">${money(total)} <span class="of">de ${money(s.monthlyMax)}</span></div>
      <div class="goal"><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <small>Meu presente: ${esc(k.goal)} · hoje você juntou ${money(dayMoney(kid,today))}${state.savings[kid]>0?` · guardado: ${money(state.savings[kid])} 🐷`:""}</small></div></div>
  </section>
  ${talkHTML(kid)}
  ${monthChoiceHTML(kid)}
  <section class="stats">
    <div class="stat"><b>${sc.total} min</b><span>de tela hoje${sc.complete||sc.manual?` (inclui ${sc.complete+sc.manual} min de bônus ⭐)`:""}</span></div>
    <div class="stat"><b>${dayPoints(kid,today)}/${maxDayPoints(kid)}</b><span>pontos hoje</span></div>
  </section>
  <div class="tabs" role="tablist">
    ${[["tarefas","Tarefas"],["combinados",`Combinados${pending?` (${pending})`:""}`],["diario","Diário"],["conquistas","Conquistas"],["mes","Cofrinho"]].map(([id,n])=>`<button role="tab" data-tab="${id}" aria-selected="${view.tab===id}">${n}</button>`).join("")}
  </div>${body}`;
}
function taskRow(t,st){
  const c=CATS[t.cat]||CATS.rotina, s=state.settings;
  const reward=`${s.pointsDone} pts · ${t.minutes} min de tela`;
  let right;
  if(st==="pending") right=`<button class="btn wait small" data-act="undo" data-id="${t.id}">Esperando os pais</button>`;
  else if(st==="done") right=`<span class="badge ok">Aprovado ✓</span>`;
  else if(st==="great") right=`<span class="badge gold">Capricho ⭐</span>`;
  else if(st==="no") right=`<span class="badge no">Fica pra amanhã</span>`;
  else right=`<button class="btn small" data-act="did" data-id="${t.id}">Fiz!</button>`;
  return `<div class="task ${st==="done"?"done":st==="great"?"done great":""}"><div class="ic" aria-hidden="true">${c.ic}</div>
    <div><div class="t">${esc(t.title)}</div><div class="r">${reward}</div></div>${right}</div>`;
}

}
function monthHTML(kid){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), max=maxDayPoints(kid)||1;
  let cells=["D","S","T","Q","Q","S","S"].map(h=>`<div class="h">${h}</div>`).join("");
  for(let i=0;i<first;i++) cells+=`<div class="h"></div>`;
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`, c=dayPoints(kid,k)/max;
    cells+=`<div class="${dayComplete(kid,k)?"l2":c>0?"l1":""} ${k===dkey()?"today":""}" title="${Math.round(c*100)}% dos pontos">${d}</div>`;
  }
  // extrato dos últimos 7 dias com movimento
  const recent=allDays().filter(d=>d.startsWith(mkey())).reverse().slice(0,7);
  const lines=d=>{
    const out=[];
    for(const t of state.tasks[kid]){const st=statusOf(kid,d,t.id); if(st==="done"||st==="great") out.push([`${(CATS[t.cat]||CATS.rotina).ic} ${t.title}${st==="great"?" ⭐":""}`,itemMoney(kid,d,st)])}
    if(hasDiary(kid,d)) out.push(["📝 Diário",itemMoney(kid,d,"diary")]);
    return out;
  };
  const extrato=recent.map(d=>{const ls=lines(d); if(!ls.length) return "";
    return `<div class="ext-day"><div class="ext-h"><span>${fmtDay(d)}</span><b>+${money(ls.reduce((a,x)=>a+x[1],0))}</b></div>
    ${ls.map(([n,v])=>`<div class="ext-l"><span>${esc(n)}</span><span>+${money(v)}</span></div>`).join("")}</div>`}).join("");
  const hist=Object.entries(state.months).filter(([,v])=>v[kid]).sort().reverse();
  const choiceTxt={presente:"usou no presente",guardar:"guardou tudo",metade:"metade presente, metade guardada"};
  const sv=state.savingsLog.filter(x=>x.kid===kid).slice(-5).reverse();
  return `<div class="card"><h3>Extrato de ${monthName(mkey())}</h3>
    ${extrato||`<p class="muted" style="margin:0">Quando os pais aprovarem suas tarefas, cada valor aparece aqui.</p>`}
    <p class="muted" style="margin:10px 0 0;font-size:.9rem;font-weight:600">Total do mês até agora: <b>${money(monthMoney(kid))}</b> de ${money(state.settings.monthlyMax)}.</p></div>
  <div class="card"><h3>🐷 Meu dinheiro guardado</h3>
    <p class="amount-sm">${money(state.savings[kid])}</p>
    ${sv.length?sv.map(x=>`<p class="ext-l"><span>${esc(x.note)} · ${fmtDay(x.date)}</span><span>${x.value>0?"+":""}${money(x.value)}</span></p>`).join(""):`<p class="muted" style="margin:0;font-size:.95rem">No fim do mês, você pode escolher guardar parte do dinheiro para comprar algo maior depois.</p>`}</div>
  <div class="card"><h3>${now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h3>
  <div class="cal">${cells}</div>
  <p class="muted" style="margin:10px 0 0;font-size:.9rem;font-weight:600">Cor forte: dia completo. Cor clara: dia com algumas tarefas. Um dia perfeito vale ${money(perfectDayMoney(kid))}.</p></div>
  ${hist.length?`<div class="card"><h3>Meses anteriores</h3>${hist.map(([mk,v])=>`<p style="margin:6px 0">${monthName(mk)}: <b>${money(v[kid].total)}</b>${v[kid].choice?` · ${choiceTxt[v[kid].choice]}`:""}</p>`).join("")}</div>`:""}`;
}

  <div class="medals">${MEDALS.map(m=>{const v=Math.min(m.v(s),m.goal), ok=v>=m.goal;
    return `<div class="medal ${ok?"got":""}"><div class="medal-ic" aria-hidden="true">${ok?m.ic:"🔒"}</div><div class="medal-n">${m.n}</div>
    ${ok?`<div class="medal-p">Conquistada!</div>`:`<div class="bar sm"><i style="width:${Math.round(v/m.goal*100)}%"></i></div><div class="medal-p">${v} de ${m.goal}</div>`}</div>`}).join("")}</div>`;
}

    <h3>Painel dos pais</h3><p class="muted">Digite o código para entrar.</p>

  const pend=pendingList();
  const newHopes=KIDS.reduce((a,k)=>a+(state.hopes[k]||[]).filter(h=>!h.seen).length,0);

  const body={familia:familyHTML,aprovar:()=>approveHTML(pend),combinados:parentExpectHTML,diarios:diariesHTML,tarefas:tasksAdminHTML,mes:monthAdminHTML}[view.ptab]();

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.who){view.who=b.dataset.who;view.draft=null;view.talkOpen=false;if(b.dataset.who!=="pais")view.unlocked=false;render();return}
  if(b.dataset.tab){view.tab=b.dataset.tab;render();return}
  if(b.dataset.ptab){view.ptab=b.dataset.ptab;render();return}
  if(b.dataset.editkid){view.editKid=b.dataset.editkid;render();return}
  if(b.dataset.mood){view.draft.mood=b.dataset.mood;render();return}
  if(b.dataset.talklevel){const t=$("#talkText");view.talkDraft=t?t.value:"";view.talkLevel=b.dataset.talklevel;render();const t2=$("#talkText");if(t2)t2.value=view.talkDraft||"";return}
  const act=b.dataset.act; if(!act) return;
  const kid=view.who, today=dkey();
  const setLog=(s,day,k,id,val)=>{s.log[day]=s.log[day]||{};s.log[day][k]=s.log[day][k]||{}; if(val==null) delete s.log[day][k][id]; else s.log[day][k][id]=val};
  switch(act){
    case "start": state=suggestions(); render(); persist(); break;
    case "did": commit(s=>setLog(s,today,kid,b.dataset.id,"pending")); toast("Boa! Agora é só os pais conferirem."); break;
    case "undo": commit(s=>setLog(s,today,kid,b.dataset.id,null)); break;
    case "saveDiary":{
      const d=view.draft; if(!d.did.trim()){toast("Conte pelo menos o que você fez hoje.");return}
      const first=!hasDiary(kid,today);
      commit(s=>{s.diary[today]=s.diary[today]||{};const prev=s.diary[today][kid]||{};s.diary[today][kid]={mood:d.mood,did:d.did,happened:d.happened,kind:d.kind,tell:d.tell,talked:prev.talked||false}});
      toast(first?`Diário salvo! +${state.settings.diaryPoints} pontos`:"Diário atualizado");
      if(first){const c=$("#coin");c&&c.classList.add("pop")} break;}
    case "accept": commit(s=>s.accepted[kid][b.dataset.id]=today); toast("Combinado!"); break;
    case "addHope":{const t=$("#hopeText").value.trim(); if(!t){toast("Escreva o que você gostaria.");return}
      commit(s=>s.hopes[kid].push({text:t,date:today,seen:false})); toast("Enviado para os pais"); break;}
    case "unlock": if(($("#pin").value||"")===state.settings.pin){view.unlocked=true;render()} else toast("Código incorreto."); break;
    case "lock": view.unlocked=false; view.who="maria"; render(); break;
    case "approve": commit(s=>setLog(s,b.dataset.day,b.dataset.kid,b.dataset.id,b.dataset.st));
      toast(b.dataset.st==="great"?"Capricho reconhecido ⭐":b.dataset.st==="done"?"Aprovado":"Marcado como não feito"); break;
    case "bonus":{
      const m=parseInt($("#bMin").value)||0, r=$("#bReason").value.trim(), who=$("#bKid").value;
      if(!r||!m){toast("Preencha o motivo e os minutos.");return}
      const ks=who==="ambos"?KIDS:[who];
      commit(s=>ks.forEach(k=>s.bonus.push({kid:k,date:today,minutes:m,reason:r}))); toast(`+${m} min de tela de bônus`); break;}
    case "rate":{const wk=weekKey(); commit(s=>{s.ratings[wk]=s.ratings[wk]||{};s.ratings[wk][b.dataset.kid]=s.ratings[wk][b.dataset.kid]||{};s.ratings[wk][b.dataset.kid][b.dataset.id]=b.dataset.r}); break;}
    case "seeHope": commit(s=>s.hopes[b.dataset.kid][+b.dataset.i].seen=true); break;
    case "addExp":{const t=$("#eText").value.trim(); if(!t){toast("Escreva o combinado.");return}
      commit(s=>s.expectations.push({id:tid(),text:t,for:$("#eFor").value})); toast("Combinado adicionado"); break;}
    case "delExp":{const x=state.expectations.find(e=>e.id===b.dataset.id);
      if(x&&confirm(`Remover "${x.text}"?`)) commit(s=>s.expectations=s.expectations.filter(e=>e.id!==x.id)); break;}
    case "talked": commit(s=>{const e=s.diary[b.dataset.day][b.dataset.kid];e.talked=!e.talked}); break;
    case "saveKid":{
      const k=view.editKid, bs=parseInt($("#kBase").value)||0, mx=parseInt($("#kMax").value)||0, both=$("#kBoth").checked;
      commit(s=>{(both?KIDS:[k]).forEach(x=>{s.kids[x].baseScreen=bs;s.kids[x].maxScreen=mx});s.kids[k].goal=$("#kGoal").value.trim()||"Presente"});
      toast("Salvo"); break;}
    case "delTask":{
      const t=state.tasks[view.editKid].find(t=>t.id===b.dataset.id);
      if(t&&confirm(`Remover "${t.title}"?`)) commit(s=>{s.tasks[view.editKid]=s.tasks[view.editKid].filter(x=>x.id!==b.dataset.id)}); break;}
    case "addTask":{
      const title=$("#nTitle").value.trim(); if(!title){toast("Dê um nome para a tarefa.");return}
      const base={title,cat:$("#nCat").value,time:$("#nTime").value,minutes:parseInt($("#nMin").value)||0};
      const both=$("#nBoth").checked;
      commit(s=>(both?KIDS:[view.editKid]).forEach(k=>s.tasks[k].push({id:tid(),...base}))); toast(both?"Tarefa adicionada para os dois":"Tarefa adicionada"); break;}
    case "closeMonth":{const mk=b.dataset.mk; if(!confirm(`Fechar ${monthName(mk)}?`)) return;
      commit(s=>{s.months[mk]={};KIDS.forEach(k=>s.months[mk][k]={total:Math.round(monthMoney(k,mk)*100)/100,gift:s.kids[k].goal})}); toast("Mês fechado. Agora cada um escolhe o que fazer."); break;}
    case "choose":{const mk=b.dataset.mk, c=b.dataset.c, v=state.months[mk][kid].total;
      const saved=c==="guardar"?v:c==="metade"?Math.round(v*50)/100:0;
      commit(s=>{s.months[mk][kid].choice=c;s.months[mk][kid].saved=saved;
        if(saved>0){s.savings[kid]=Math.round((s.savings[kid]+saved)*100)/100;s.savingsLog.push({kid,date:today,value:saved,note:`Guardado de ${monthName(mk)}`})}});
      toast(c==="presente"?"Combine com os pais a compra do presente 🎁":`${money(saved)} guardados no porquinho 🐷`); break;}
    case "withdraw":{const k=$("#wKid").value, v=parseFloat($("#wValue").value)||0, n=$("#wNote").value.trim()||"Retirada";
      if(v<=0){toast("Informe o valor.");return} if(v>state.savings[k]){toast("O valor é maior que o guardado.");return}
      commit(s=>{s.savings[k]=Math.round((s.savings[k]-v)*100)/100;s.savingsLog.push({kid:k,date:today,value:-v,note:n})}); toast("Retirada registrada"); break;}
    case "openTalk": view.talkOpen=true; view.talkLevel=null; view.talkDraft=""; render(); break;
    case "cancelTalk": view.talkOpen=false; render(); break;
    case "sendTalk":{ if(!view.talkLevel){toast("Escolha o tipo de conversa.");return}
      const text=($("#talkText").value||"").trim();
      view.talkOpen=false; commit(s=>s.talks.push({kid,level:view.talkLevel,text,date:today,done:false})); toast("Pedido enviado 💛"); break;}
    case "talkDone": commit(s=>s.talks[+b.dataset.i].done=true); break;
    case "setMission":{const text=b.dataset.text||($("#mText")?$("#mText").value.trim():""); if(!text){toast("Escolha ou escreva uma missão.");return}
      commit(s=>s.missions[weekKey()]={text,done:false}); toast("Missão definida"); break;}
    case "missionClear": commit(s=>delete s.missions[weekKey()]); break;
    case "missionDone": commit(s=>{s.missions[weekKey()].done=true;KIDS.forEach(k=>s.bonus.push({kid:k,date:today,minutes:s.settings.completeBonus,reason:"Missão da família cumprida"}))}); toast("Missão cumprida! 🎉"); break;
    case "export":{
      const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`casa-em-dia-backup-${dkey()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); break;}
    case "saveSettings":{
      const pin=$("#sPin").value.trim(); if(!pin){toast("O código não pode ficar vazio.");return}
      commit(s=>{s.settings.monthlyMax=parseFloat($("#sMax").value)||0;s.settings.completeBonus=parseInt($("#sCB").value)||0;s.settings.greatScreenPct=parseInt($("#sGS").value)||0;s.settings.pin=pin});
      toast("Salvo"); break;}
  }
});
document.addEventListener("change",e=>{
  if(e.target.id!=="importFile"||!e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.kids||!d.tasks) throw 0;
    if(confirm("Substituir os dados deste aparelho pelo backup?")){state=migrate(d);persist();render();toast("Backup restaurado")}}
    catch(err){toast("Esse arquivo não é um backup do Casa em Dia.")}};
  r.readAsText(e.target.files[0]);
});
document.addEventListener("input",e=>{const f=e.target.dataset.draft; if(f&&view.draft) view.draft[f]=e.target.value});

/* ===================== Início ===================== */
state=migrate(loadLocal()); if(state) persist(); setSaveState(); render();
</script>
</body>
