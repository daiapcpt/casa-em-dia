<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa em Dia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa em Dia">
<meta name="theme-color" content="#8D67E8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A5A; --ink-soft:#4A5580; --paper:#F4F7FF; --card:#FFFFFF; --line:#DCE3F5;
  --coin:#B99AFF; --coin-deep:#7B56D9; --leaf:#2E9E6A; --leaf-bg:#E3F5EC;
  --wait:#8A6DD8; --wait-bg:#EEE8FB; --no:#D9534F;
  --maria:#8D67E8; --maria-bg:#EEE8FF; --joao:#1F9BB5; --joao-bg:#DDF3F8; --pais:#1E2A5A; --pais-bg:#E4E8F5;
  --kid:var(--maria); --kid-bg:var(--maria-bg);
  --corrida:#397DE8; --corrida-bg:#DCE8FF; --musica:#A83FC4; --musica-bg:#F5E5FA; --padrao:#1F9BB5; --padrao-bg:#DDF3F8; --tio:#3F7D4E; --tio-bg:#E1F0E4; --k3:#5A6B8C; --k3-bg:#EEF1FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEF1FF; --ink-soft:#AEB6D6; --paper:#12172E; --card:#1C2342; --line:#2E3760;
    --leaf-bg:#173A2C; --wait-bg:#2B2550; --maria-bg:#33284D; --joao-bg:#123A45; --pais-bg:#2A3258; --pais:#C9D1F5; --corrida:#5A9BFF; --corrida-bg:#14243E; --musica:#D78BEA; --musica-bg:#37203F; --tio:#8FD19E; --tio-bg:#1D3522; --k3:#7EB1FF; --k3-bg:#162B4B;
  }
}
:root[data-theme="dark"]{
  --ink:#EEF1FF; --ink-soft:#AEB6D6; --paper:#12172E; --card:#1C2342; --line:#2E3760;
  --leaf-bg:#173A2C; --wait-bg:#2B2550; --maria-bg:#33284D; --joao-bg:#123A45; --pais-bg:#2A3258; --pais:#C9D1F5; --corrida:#5A9BFF; --corrida-bg:#14243E; --musica:#D78BEA; --musica-bg:#37203F; --tio:#8FD19E; --tio-bg:#1D3522; --k3:#7EB1FF; --k3-bg:#162B4B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,.display{font-family:"Baloo 2",Nunito,system-ui,sans-serif;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 48px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 14px}
.brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .dot{width:26px;height:26px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -3px 0 var(--coin-deep);display:grid;place-items:center;font-size:.85rem;color:#4A3A72}
.who{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:999px}
.who button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:800;color:var(--ink-soft)}
.who button[aria-pressed="true"]{background:var(--kid-bg);color:var(--kid)}

/* cofrinho */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:18px}
.hello h1{font-size:2.3rem;font-weight:800;color:var(--kid)}
.hello p{margin:2px 0 0;color:var(--ink-soft);font-weight:600}
.bank{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.coin{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E7DFF8,var(--coin) 55%,var(--coin-deep));box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;color:#4A3A72;font-size:1.6rem}
.coin.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.15) rotate(-8deg)}}
@media (prefers-reduced-motion: reduce){.coin.pop{animation:none}}
.bank .amount{font-family:"Baloo 2";font-weight:800;font-size:2.4rem;line-height:1}
.bank .label{color:var(--ink-soft);font-weight:700;font-size:.95rem}
.goal{margin-top:8px}
.bar{height:12px;background:var(--paper);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--coin);border-radius:99px;transition:width .4s}
.goal small{display:block;margin-top:4px;color:var(--ink-soft);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:var(--kid-bg);border-radius:20px;padding:12px 16px}
.stat b{font-family:"Baloo 2";font-size:1.7rem;font-weight:800;color:var(--kid);display:block;line-height:1.1}
.stat span{font-weight:700;font-size:.9rem;color:var(--ink-soft)}

/* abas */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:800;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--kid);border-bottom-color:var(--kid)}

/* tarefas */
.moment{margin:18px 0 8px;font-family:"Baloo 2";font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.moment span{font-size:.9rem;font-family:Nunito;font-weight:700;color:var(--ink-soft)}
.task{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.task .ic{width:40px;height:40px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font-size:1.3rem}
.task .t{font-weight:700;line-height:1.3}
.task .r{font-size:.82rem;color:var(--ink-soft);font-weight:700}
.task.done{border-color:var(--leaf);background:var(--leaf-bg)}
.task.great{border-color:var(--coin-deep)}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:800;background:var(--kid);color:#fff;min-height:44px}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.wait{background:var(--wait-bg);color:var(--wait)}
.btn.ok{background:var(--leaf);color:#fff}
.btn.gold{background:var(--coin);color:#5A3C00}
.btn.no{background:transparent;color:var(--no);border:2px solid var(--line)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.badge{font-weight:800;font-size:.9rem;padding:8px 12px;border-radius:12px;white-space:nowrap}
.badge.ok{background:var(--leaf);color:#fff}
.badge.gold{background:var(--coin);color:#5A3C00}
.badge.no{background:var(--paper);color:var(--ink-soft)}

/* diário */
.moods{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.moods button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;font-size:1.7rem;line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.moods button small{font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.moods button[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg)}
label.f{display:block;font-weight:800;margin:14px 0 6px}
textarea,input[type=text],input[type=number],input[type=password],select{width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.note{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;color:var(--ink-soft);font-weight:600;font-size:.95rem}

/* painel */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{font-size:1.2rem;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.pend{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pend:first-of-type{border-top:0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:800;font-size:.8rem}
.chip.maria{background:var(--maria-bg);color:var(--maria)}
.chip.joao{background:var(--joao-bg);color:var(--joao)}
.diary-entry{border-top:1px solid var(--line);padding:12px 0}
.diary-entry:first-child{border-top:0}
.diary-entry p{margin:4px 0}
.diary-entry .q{font-weight:800;font-size:.85rem;color:var(--ink-soft);margin-top:8px}
.muted{color:var(--ink-soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--paper);color:var(--ink-soft)}
.cal .l1{background:var(--kid-bg);color:var(--kid)}
.cal .l2{background:var(--kid);color:#fff}
.cal .today{outline:2px solid var(--ink)}
.cal .h{background:none;aspect-ratio:auto;font-size:.75rem}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-size:.95rem}
th{font-size:.8rem;color:var(--ink-soft);border-top:0}
.welcome{text-align:center;padding:40px 16px}
.welcome h1{font-size:2.4rem;margin-bottom:10px}
.welcome p{max-width:46ch;margin:0 auto 20px;color:var(--ink-soft);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:14px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.save-state{font-size:.8rem;color:var(--ink-soft);font-weight:700;text-align:center;margin-top:28px}
.hidden{display:none!important}
@media (max-width:520px){
  .hello h1{font-size:1.9rem}
  .bank .amount{font-size:2rem}
  .coin{width:68px;height:68px;font-size:1.3rem}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 > :first-child{grid-column:1/-1}
}
.bank .amount .of{font-size:1rem;color:var(--ink-soft);font-family:Nunito;font-weight:700}
.exp{padding:12px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp-t{font-weight:700;margin:0 0 8px;line-height:1.35}
.rate{font-weight:700;font-size:.9rem}
.hope{margin:8px 0;font-weight:600}
h4.sub{margin:16px 0 4px}
.amount-sm{font-family:"Baloo 2";font-weight:800;font-size:1.8rem;margin:0 0 6px}
.ext-day{border-top:1px solid var(--line);padding:10px 0}
.ext-day:first-of-type{border-top:0;padding-top:0}
.ext-h{display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px}
.ext-h b{color:var(--leaf)}
.ext-l{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--ink-soft);font-weight:600;margin:2px 0}
.ext-l span:last-child{white-space:nowrap}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.medal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center}
.medal.got{border:2px solid var(--coin);background:var(--kid-bg)}
.medal-ic{font-size:2.2rem;line-height:1.2}
.medal:not(.got) .medal-ic{opacity:.5}
.medal-n{font-weight:800;font-size:.9rem;line-height:1.3;margin:6px 0}
.medal-p{font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-top:4px}
.bar.sm{height:8px}
.mission{display:flex;gap:12px;align-items:center;background:var(--card);border:2px dashed var(--coin);border-radius:20px;padding:12px 14px;margin-top:14px}
.mission.done{border-style:solid;border-color:var(--leaf)}
.mission-ic{font-size:2rem}
.mission-l{font-size:.82rem;font-weight:800;color:var(--ink-soft)}
.mission-t{font-weight:800;font-size:1.05rem}
.talk-btn{background:var(--card);color:var(--kid);border:2px solid var(--kid)}
.talk-opts{display:grid;gap:8px}
.talk-opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:700}
.talk-opt[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg)}
.choice{border:2px solid var(--coin)}
.alert{display:block;width:100%;text-align:left;border:0;background:var(--wait-bg);color:var(--wait);font-weight:800;padding:12px 16px;border-radius:16px;margin-bottom:14px}
/* ---------- temas ---------- */
:root[data-kt="corrida"] .hello h1,:root[data-kt="corrida"] .moment,:root[data-kt="corrida"] .bank .amount,:root[data-kt="corrida"] .stat b,:root[data-kt="corrida"] .card h3{font-family:"Russo One","Baloo 2",system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
:root[data-kt="musica"] .hello h1,:root[data-kt="musica"] .moment,:root[data-kt="musica"] .bank .amount,:root[data-kt="musica"] .stat b,:root[data-kt="musica"] .card h3{font-family:Fredoka,"Baloo 2",system-ui,sans-serif;font-weight:600}
.bank{position:relative;overflow:hidden}
.deco{position:absolute;right:14px;top:10px;font-size:1.4rem;opacity:.8}
:root[data-kt="corrida"] .bank{border-color:var(--kid);border-width:2px}
:root[data-kt="corrida"] .bank::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%) 0 0/8px 8px;opacity:.85}
:root[data-kt="musica"] .bank{border:0;background:linear-gradient(135deg,var(--musica-bg),var(--card) 70%);box-shadow:inset 0 0 0 2px var(--kid)}
.track{position:relative;height:30px;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(128,128,128,.35) 14px 22px) center/100% 2px no-repeat,#3A3F4B;border-radius:8px;margin-top:6px;overflow:visible}
.track-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(215,38,30,.55));border-radius:8px}
.car{position:absolute;top:50%;transform:translate(-60%,-55%) scaleX(-1);font-size:1.6rem;line-height:1;transition:left .5s}
.finish{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/7px 7px;border-radius:0 8px 8px 0}
.stage{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.stage span{font-size:1.5rem;line-height:1;color:var(--line);transition:color .3s}
.stage span.on{color:var(--kid);text-shadow:0 0 10px var(--kid)}
@media (prefers-reduced-motion: reduce){.car,.stage span{transition:none}}
/* ---------- leitura e estudos ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.book{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--kid);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.book.read{border-left-color:var(--leaf)}
.book-t{font-weight:800;line-height:1.25}
.book-a{font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.book-d{font-size:.9rem;margin:4px 0 8px;color:var(--ink-soft);flex:1}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.card a{color:var(--kid)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.chip-btn[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg);color:var(--kid)}
.chip-btn.static{cursor:default}
.tabs{scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* ---------- v4 ---------- */
.who{align-items:center}
.who .me{font-weight:800;padding:6px 10px;color:var(--kid)}
.who button{background:var(--kid-bg)!important;color:var(--kid)!important}
.home{padding:10px 0 20px}
.home h1{font-size:2.2rem;margin:8px 0 18px}
.home-sub{font-size:1.2rem;margin:26px 0 12px;color:var(--ink-soft)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{position:relative;border:2px solid var(--c,var(--line));background:var(--cb,var(--card));border-radius:24px;padding:22px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
.pcard.adult{--c:var(--line);--cb:var(--card)}
.pc-ic{font-size:2.6rem;line-height:1}
.pc-n{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:1.4rem;color:var(--c,var(--ink))}
.pcard.adult .pc-n{color:var(--ink)}
.pc-t{font-size:.78rem;font-weight:800;color:var(--ink-soft)}
.pc-l{position:absolute;top:10px;right:12px;font-size:.9rem}
.kids-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.when{font-size:.78rem;color:var(--ink-soft);font-weight:700}
.feel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.feel{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.feel span{font-size:2rem;line-height:1}
.feel small{font-weight:700;font-size:.78rem;color:var(--ink-soft);text-align:center;line-height:1.2}
.feel[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg)}
.thermo{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.thermo button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:62px;min-height:92px}
.thermo .th-bar{display:block;width:18px;border-radius:6px;background:var(--line)}
.thermo button[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-bg)}
.thermo button[aria-pressed="true"] .th-bar{background:var(--kid)}
.thermo small{font-size:.72rem;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.15}
.reply{border:2px solid var(--leaf);background:var(--leaf-bg)}
.alert.soft{background:var(--kid-bg);color:var(--kid)}
.msg.mine{opacity:.85}
.feel-line{margin:8px 0 4px;font-size:1.05rem}
.diary-entry p{overflow-wrap:anywhere}
/* ---------- abas em caixinhas ---------- */
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;border-bottom:0;margin-bottom:18px;overflow:visible}
.tabs button{--tc:#1F9BB5;border:2px solid transparent;border-radius:16px;margin:0;padding:12px 8px;min-height:52px;white-space:normal;line-height:1.2;
  background:color-mix(in srgb,var(--tc) 14%,var(--card));color:color-mix(in srgb,var(--tc) 80%,var(--ink));font-weight:800;font-size:.92rem;text-align:center}
.tabs button:nth-child(7n+1){--tc:#2E9E6A}
.tabs button:nth-child(7n+2){--tc:#E0457B}
.tabs button:nth-child(7n+3){--tc:#8A6DD8}
.tabs button:nth-child(7n+4){--tc:#1F9BB5}
.tabs button:nth-child(7n+5){--tc:#7B56D9}
.tabs button:nth-child(7n+6){--tc:#D7261E}
.tabs button:nth-child(7n+7){--tc:#5A6B8C}
.tabs button[aria-selected="true"]{background:var(--tc);color:#fff;border-color:var(--tc);box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 70%,#000)}
@supports not (background:color-mix(in srgb,red 50%,blue)){.tabs button{background:var(--card);border-color:var(--tc);color:var(--ink)}}
@media (max-width:520px){.tabs{grid-template-columns:repeat(3,1fr)}.tabs button{font-size:.85rem;padding:10px 4px}}

.maria-section-title span{font-size:.74rem;font-weight:900;color:#8869b6}
.maria-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.maria-card{background:linear-gradient(180deg,#fff,#fffaff);border:1px solid rgba(145,102,206,.14);border-radius:23px;padding:15px;box-shadow:0 10px 28px rgba(71,45,117,.08);min-width:0}
.maria-card.soft{background:linear-gradient(145deg,#fff8ff,#f1e8ff)}
.maria-card.green{background:linear-gradient(145deg,#fafffc,#effaf4)}
.maria-card.pink{background:linear-gradient(145deg,#fff9fd,#ffedf8)}
.maria-card .m-label{font-size:.74rem;color:#8166a9;font-weight:900;margin-bottom:5px}
.maria-card .m-value{font-family:Fredoka,"Baloo 2",sans-serif;color:var(--mink);font-size:1.7rem;font-weight:700;line-height:1.05}
.maria-card .m-small{font-size:.76rem;color:#766987;font-weight:800}
.maria-progress{height:9px;border-radius:99px;background:#eee5f7;overflow:hidden;margin:10px 0 5px}
.maria-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9b63f2,#d58bdd)}
.maria-pig{float:right;font-size:2.4rem;filter:drop-shadow(0 5px 5px rgba(70,35,100,.12))}
.maria-card-action{width:100%;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(90deg,#8b4ce5,#b45ce9);color:#fff;padding:10px 12px;font-weight:900;min-height:42px}
.maria-mission{display:flex;gap:10px;align-items:center}
.maria-mission-ic{width:44px;height:44px;border-radius:15px;background:#f0e3ff;display:grid;place-items:center;font-size:1.45rem;flex:0 0 auto}
.maria-mission strong{display:block;color:var(--mink);font-size:.9rem;line-height:1.25}
.maria-mission small{display:block;color:#806e96;font-weight:800;margin-top:2px}
.maria-mood{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.maria-mood button{border:0;background:transparent;border-radius:14px;padding:5px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.maria-mood button span{font-size:1.55rem;line-height:1}
.maria-mood button small{font-size:.56rem;line-height:1.1;color:#7b7086;font-weight:900;text-align:center}
.maria-mood button[aria-pressed=true]{background:#f0e5ff;box-shadow:inset 0 0 0 2px #aa76e8}
.maria-action-card{display:flex;align-items:center;gap:12px}
.maria-action-icon{width:52px;height:52px;border-radius:18px;background:#efe0ff;display:grid;place-items:center;font-size:1.65rem;flex:0 0 auto}
.maria-action-card h3{font-family:Fredoka,"Baloo 2",sans-serif;font-size:1.05rem;color:var(--mink);margin:0 0 2px}
.maria-action-card p{margin:0;color:#7b6b89;font-size:.75rem;font-weight:700;line-height:1.35}
.maria-record{margin-top:10px;border:0;border-radius:15px;background:#8b4ce5;color:#fff;padding:10px 12px;width:100%;font-weight:900}
.maria-tasks{display:flex;flex-direction:column;gap:7px}
.maria-task{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;background:#fbf9ff;border:1px solid #eee5f7;border-radius:16px;padding:9px}
.maria-task .ti{width:38px;height:38px;border-radius:12px;background:#f1e8ff;display:grid;place-items:center;font-size:1.15rem}
.maria-task strong{display:block;font-size:.78rem;color:#33264f;line-height:1.2}
.maria-task small{display:block;color:#8a7a98;font-size:.67rem;font-weight:800;margin-top:2px}
.maria-check{width:24px;height:24px;border-radius:8px;border:2px solid #c8b3e7;background:#fff;display:grid;place-items:center;color:#fff;font-size:.7rem}
.maria-task.done .maria-check{background:#7bc494;border-color:#7bc494}
.maria-task.done strong{text-decoration:line-through;opacity:.65}
.maria-viewall{border:0;background:none;color:#8a42df;font-weight:900;font-size:.75rem}
.maria-voice{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;border-radius:17px;background:#faf5ff;border:1px solid #eadbf9}
.maria-mic{width:38px;height:38px;border-radius:50%;background:#944de9;color:#fff;display:grid;place-items:center;font-size:1rem}
.maria-wave{flex:1;height:28px;background:repeating-linear-gradient(90deg,#d6b8f5 0 3px,transparent 3px 7px);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);opacity:.8}
.maria-time{font-size:.7rem;font-weight:900;color:#8a759b}
.maria-creative{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.maria-thumb{aspect-ratio:1;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#f0e1ff,#fff1fa);display:grid;place-items:center;font-size:1.6rem;border:1px solid #eadcf6}
.maria-creative-add{margin-top:8px;border:1px dashed #c99ce9;background:#fff8ff;color:#8d45d8;border-radius:13px;width:100%;padding:8px;font-weight:900;font-size:.75rem}
.maria-achievements{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.maria-achievement{border-radius:15px;background:#fbf7ff;border:1px solid #eadff4;padding:8px 4px;text-align:center}
.maria-achievement b{display:block;font-size:1.25rem}.maria-achievement small{display:block;color:#7d7187;font-size:.58rem;font-weight:900;line-height:1.15}
.maria-reading{display:flex;gap:10px;align-items:center}
.maria-book{width:54px;height:70px;border-radius:7px 11px 11px 7px;background:linear-gradient(135deg,#9d58e8,#6331a5);color:#fff;display:grid;place-items:center;font-size:1.7rem;box-shadow:3px 5px 0 rgba(70,35,110,.12);flex:0 0 auto}
.maria-bottom{position:sticky;bottom:8px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid #e8def3;border-radius:22px;padding:7px 5px;box-shadow:0 12px 30px rgba(65,35,100,.16)}
.maria-bottom button{border:0;background:transparent;border-radius:16px;padding:7px 2px;color:#776786;font-weight:900;font-size:.62rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.maria-bottom button span{font-size:1.2rem;line-height:1}
.maria-bottom button[aria-selected=true]{background:#eee1ff;color:#7d39d4}
.maria-bottom .plus{background:linear-gradient(145deg,#9b4cf0,#b55de7);color:#fff;border-radius:50%;width:48px;height:48px;margin:-20px auto 0;box-shadow:0 8px 18px rgba(132,63,214,.3);font-size:1.55rem}
.maria-bottom .plus span{font-size:1.7rem}
@media(max-width:390px){.maria-shortcuts{gap:4px}.maria-shortcut{font-size:.61rem;min-height:66px}.maria-grid2{gap:8px}.maria-card{padding:12px}.maria-copy h1{font-size:1.85rem}.maria-hero-main{grid-template-columns:1fr 105px}.maria-orbit{height:118px}.maria-mood button span{font-size:1.38rem}}
@media(min-width:650px){.maria-app{max-width:720px;margin:0 auto}.maria-shell{gap:16px}.maria-hero{padding:26px 24px}.maria-copy h1{font-size:2.4rem}.maria-grid2{gap:12px}}

   V7 — MARIA · referência visual fiel ao mockup aprovado

.maria-exact{--purple:#7b2de2;--purple2:#a65bea;--lav:#efe2ff;--pink:#f8dff1;--ink:#241747;--muted:#75688f;--white:#fffaff;--green:#9dd9c2;--blue:#d9f0ff;
  max-width:1120px;margin:0 auto;padding:0 18px 50px;position:relative}
.maria-exact *{box-sizing:border-box}

.maria-exact .exact-side{background:rgba(255,255,255,.72);border-right:1px solid rgba(110,71,157,.12);padding:15px 9px;display:flex;flex-direction:column;align-items:center;gap:17px}
.maria-exact .side-home{font-size:29px;margin-bottom:3px}
.maria-exact .side-person{border:0;background:transparent;width:68px;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-weight:800;font-size:12px}

.maria-exact .creative-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 13px}.maria-exact .creative-tabs button{border:0;border-radius:999px;background:#f0e2fb;padding:8px 14px;font-weight:900;color:#49346b}.maria-exact .creative-tabs .active{background:#8c32df;color:#fff}.maria-exact .upload{height:112px;border:2px dashed #d7c2eb;border-radius:13px;background:#fbf7ff;display:grid;place-items:center;text-align:center;color:#837397;font-weight:800}.maria-exact .creative-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* V8 — aproveitar melhor a tela no layout da Maria */
.wrap:has(.maria-exact){
  max-width:1480px;
  width:100%;
  padding-left:24px;
  padding-right:24px;
}
.maria-exact{
  max-width:none !important;
  width:100%;
}
@media (max-width:900px){
  .wrap:has(.maria-exact){
    padding-left:12px;
    padding-right:12px;
  }
}
@media (max-width:650px){
  .wrap:has(.maria-exact){
    padding-left:0;
    padding-right:0;
  }
  .maria-exact{
    padding-left:8px;
    padding-right:8px;
  }
}

function dayPoints(k,day){
  const s=state.settings; let p=0;
  for(const x of state.tasks[k]){
    const st=statusOf(k,day,x.id);
    // A criança já declarou o resultado da tarefa. Enquanto aguarda
    // aprovação do adulto, o progresso visual já reconhece o esforço.
    // Se o adulto depois corrigir para "não feito" ou "precisa melhorar",
    // o valor deixa de contar automaticamente.
    const claim=claimOf(k,day,x.id);
    const effective=(st==="pending" && (claim==="done"||claim==="great"))?claim:st;
    if(effective==="done")p+=s.pointsDone;
    else if(effective==="great")p+=s.pointsGreat;
  }
  if(hasDiary(k,day)) p+=s.diaryPoints;
  return p;
}
const maxDayPoints=k=>state.tasks[k].length*state.settings.pointsGreat+state.settings.diaryPoints;
function daysIn(mk){const [y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate()}
function allDays(){return [...new Set([...Object.keys(state.log),...Object.keys(state.diary)])].sort()}
function monthMoney(k,mk=mkey()){
  let pts=0; for(const d of allDays()) if(d.startsWith(mk)) pts+=dayPoints(k,d);
  const max=daysIn(mk)*maxDayPoints(k);
  return Math.min(state.settings.monthlyMax, max?state.settings.monthlyMax*pts/max:0);
}
function itemMoney(k,day,st){
  const s=state.settings, max=daysIn(day.slice(0,7))*maxDayPoints(k);
  const p=st==="great"?s.pointsGreat:st==="done"?s.pointsDone:st==="diary"?s.diaryPoints:0;
  return max?s.monthlyMax*p/max:0;
}
const dayMoney=(k,day)=>{const max=daysIn(day.slice(0,7))*maxDayPoints(k);return max?state.settings.monthlyMax*dayPoints(k,day)/max:0};
const perfectDayMoney=()=>state.settings.monthlyMax/daysIn(mkey());
function dayComplete(k,day){
  if(!state.tasks[k].length) return false;
  return state.tasks[k].every(x=>["done","great"].includes(statusOf(k,day,x.id))) && hasDiary(k,day);
}
function screenToday(k){
  const kd=state.kids[k], day=dkey(), s=state.settings; let earned=0;
  for(const x of state.tasks[k]){const st=statusOf(k,day,x.id); if(st==="done")earned+=x.minutes; else if(st==="great")earned+=Math.round(x.minutes*(1+s.greatScreenPct/100))}
  const normal=Math.min(kd.baseScreen+earned,kd.maxScreen);
  const complete=dayComplete(k,yesterday())?s.completeBonus:0;
  const manual=state.bonus.filter(b=>b.kid===k&&b.date===day).reduce((a,b)=>a+b.minutes,0);
  return {base:kd.baseScreen, earned, normal, complete, manual, total:normal+complete+manual};
}

function kidStats(k){
  const cat={}, st={great:0,diaries:0,complete:0,best:0}; let run=0, prev=null;
  for(const d of allDays()){
    const seen=new Set();
    for(const x of state.tasks[k]){const s=statusOf(k,d,x.id); if(s==="done"||s==="great"){seen.add(x.cat); if(s==="great")st.great++}}
    seen.forEach(c=>cat[c]=(cat[c]||0)+1);
    if(hasDiary(k,d)) st.diaries++;
    if(dayComplete(k,d)){st.complete++; const c=prev&&(parseDay(d)-parseDay(prev))/864e5===1; run=c?run+1:1; prev=d; st.best=Math.max(st.best,run)}
  }
  st.cat=cat;
  st.missions=Object.values(state.missions).filter(m=>m.done).length;
  st.saved=Object.values(state.months).filter(m=>m[k]&&m[k].saved>0).length;
  st.books=new Set((state.readingLog[k]||[]).filter(r=>r.finished).map(r=>r.title.toLowerCase())).size;
  st.studyDays=new Set((state.studyLog[k]||[]).map(r=>r.date)).size;
  return st;
}

let REC=null;
function startDictation(target){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Este navegador não consegue transformar fala em texto. Tente pelo Chrome.");return}
  if(REC){try{REC.stop()}catch(e){} REC=null; if(view.dictating===target){view.dictating=null;render();return}}
  const [form,field]=target.split(":");
  const r=new SR(); r.lang="pt-BR"; r.interimResults=false; r.continuous=true;
  r.onresult=ev=>{let txt="";for(let i=ev.resultIndex;i<ev.results.length;i++) if(ev.results[i].isFinal) txt+=ev.results[i][0].transcript;
    if(txt){const cur=F(form)[field]||""; F(form)[field]=(cur?cur.trim()+" ":"")+txt.trim(); render()}};
  r.onerror=ev=>{toast(ev.error==="not-allowed"?"Permita o uso do microfone para falar.":"Não consegui ouvir. Tente de novo.")};
  r.onend=()=>{if(REC===r){REC=null;view.dictating=null;render()}};
  try{r.start(); REC=r; view.dictating=target; render(); toast("Pode falar 🎤")}catch(e){toast("Não consegui ligar o microfone.")}
}

function mariaRoutineHTML(k){
  const r=ensureRoutines(state)[k]||DEFAULT_ROUTINES[k]||DEFAULT_ROUTINES.maria;
  const weekend=[0,6].includes(new Date().getDay());
  const items=weekend?r.weekend:r.weekday;
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const html=items.map((it,i)=>{
    const m=(it.time||"23:59").match(/^(\d{1,2}):(\d{2})/); const mins=m?Number(m[1])*60+Number(m[2]):9999;
    const done=nowMin>=mins+30;
    return `<div class="routine-item"><span class="routine-time">${esc(it.time)}</span><span class="routine-icon">${esc(it.icon||"✨")}</span><div><span class="routine-name">${esc(it.name)}</span><span class="routine-sub">${esc(it.sub||"")}</span></div><span class="routine-state ${done?'done':''}">${done?'✓':'○'}</span></div>`;
  }).join("");
  return `<section class="exact-card day-guide"><div class="day-guide-head"><div><h3>🌞 Meu dia</h3><div class="day-label">${weekend?'Fim de semana · manhã leve':'Dia de escola · manhã alegre'}</div></div><span class="screen-time">${weekend?(r.weekend[0]?.time||'09:00'):(r.weekday[0]?.time||'07:30')}</span></div><div class="routine-list">${html||'<div class="note">Ainda não há horários configurados.</div>'}</div></section>`;
}

function weeklyEvolutionHTML(k){
  const now=new Date(), wd=(now.getDay()+6)%7, monday=new Date(now); monday.setHours(0,0,0,0); monday.setDate(now.getDate()-wd);
  const days=[]; for(let i=0;i<7;i++){const d=new Date(monday); d.setDate(monday.getDate()+i); if(d<=now) days.push(dkey(d));}
  const cats={}; let total=0, done=0, great=0, needs=0, no=0;
  for(const day of days){
    for(const x of (state.tasks[k]||[])){
      total++; const st=statusOf(k,day,x.id), claim=claimOf(k,day,x.id);
      const eff=(st==='pending'&&(claim==='done'||claim==='great'))?claim:st;
      const cat=x.cat||'rotina'; cats[cat]=cats[cat]||{total:0,done:0}; cats[cat].total++;
      if(eff==='done'||eff==='great'){done++;cats[cat].done++;if(eff==='great')great++;}
      else if(eff==='needs') needs++; else if(eff==='no') no++;
    }
  }
  const names={organizacao:['🧺','Organização'],higiene:['🚿','Autocuidado'],estudo:['📚','Estudos'],convivencia:['💛','Convivência'],rotina:['⏰','Rotina'],leitura:['📖','Leitura'],limpeza:['🧽','Cuidado'],refeicao:['🍽️','Refeições'],curso:['🎓','Aprendizado']};
  const entries=Object.entries(cats).filter(([c,v])=>v.total>0).sort((a,b)=>(b[1].done/b[1].total)-(a[1].done/a[1].total)).slice(0,6);
  const alone=days.filter(d=>state.kids[k].screenSelfCheck?.[d]?.status==='alone').length;
  const missionDays=days.filter(d=>state.weatherMissions?.[d]?.[k]?.done).length;
  const pct=total?Math.round(done/total*100):0;
  let phrase=done===0?'Cada pequena tentativa conta. Vamos começar! 💜':done<Math.max(3,total*.35)?'Você já começou a construir sua rotina. Continue! 🌱':done<Math.max(6,total*.7)?'Olha só quanta coisa você já está conseguindo fazer! 💜':'Você está mostrando cada vez mais autonomia! 🌟';
  return `<section class="exact-card evolution-card" style="margin-top:14px"><div class="exact-head"><h3>🌱 Minha evolução</h3><span class="screen-time">esta semana</span></div>
    <div class="evolution-grid">${entries.map(([c,v])=>{const q=Math.round(v.done/v.total*100), n=names[c]||['✨',CATS[c]?.n||c];return `<div class="evo-item"><div class="evo-top"><span>${n[0]} ${n[1]}</span><span>${q}%</span></div><div class="evo-bar"><i style="width:${q}%"></i></div></div>`}).join('')}</div>
    <div class="evo-stats"><div class="evo-stat"><b>${done}</b><span>tarefas feitas</span></div><div class="evo-stat"><b>${great}</b><span>com capricho</span></div><div class="evo-stat"><b>${missionDays}</b><span>missões</span></div></div>
    <div class="evo-summary">${phrase}<br><span style="font-weight:700">📱 ${alone} dia${alone===1?'':'s'} guardando o celular sozinho · 🔄 ${needs} para melhorar · 🟠 ${no} não concluída${no===1?'':'s'}.</span></div>
  </section>`;
}

const setLog=(s,day,k,id,val)=>{s.log[day]=s.log[day]||{};s.log[day][k]=s.log[day][k]||{}; if(val==null) delete s.log[day][k][id]; else s.log[day][k][id]=val};
const setTime=(s,day,k,id,patch)=>{s.times[day]=s.times[day]||{};s.times[day][k]=s.times[day][k]||{}; if(patch==null) delete s.times[day][k][id]; else s.times[day][k][id]={...(s.times[day][k][id]||{}),...patch}};
function autoPending(s,k,cat){
  const task=state.tasks[k].find(x=>x.cat===cat), today=dkey();
  if(task&&!statusOf(k,today,task.id)){setLog(s,today,k,task.id,"pending");setTime(s,today,k,task.id,{did:Date.now()});return true}
  return false;
}

let mariaBathTimer=null;
let mariaBathEndsAt=0;
let mariaBathStartedAt=0;
let mariaBathSpoken={};
let mariaBathVoiceMuted=false;
let mariaVoice=null;
function pickMariaVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices=window.speechSynthesis.getVoices()||[];
  const preferred=voices.find(v=>/pt-BR/i.test(v.lang)&&/(female|feminina|woman|luciana|fernanda|google português|microsoft)/i.test(v.name))
    || voices.find(v=>/pt-BR/i.test(v.lang))
    || voices.find(v=>/^pt/i.test(v.lang));
  mariaVoice=preferred||null; return mariaVoice;
}
function speakMaria(text){
  if(mariaBathVoiceMuted || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='pt-BR'; u.rate=.94; u.pitch=1.08; u.volume=1;
    u.voice=pickMariaVoice();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=()=>pickMariaVoice(); pickMariaVoice(); }
function updateMariaBathTimer(){
  const el=document.getElementById('bathTimer'); if(!el||!mariaBathEndsAt) return;
  const left=Math.max(0,mariaBathEndsAt-Date.now());
  const sec=Math.ceil(left/1000), mm=String(Math.floor(sec/60)).padStart(2,'0'), ss=String(sec%60).padStart(2,'0');
  el.textContent=`${mm}:${ss}`;
  if(sec<=600 && !mariaBathSpoken.ten){mariaBathSpoken.ten=true;toast('🚿 Faltam 10 minutos para a meta.');speakMaria('Maria, você já está há dez minutos no banho.');}

async function updateMariaWeather(){
  const box=document.getElementById('mariaWeather'); if(!box) return;
  box.innerHTML='<div class="weather-status">📍 Pegando sua localização atual e consultando o clima…</div>';
  if(!navigator.geolocation){box.innerHTML='<div class="weather-status">Seu navegador não permitiu consultar sua localização. Escolha uma atividade por conta própria.</div>';return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const lat=Number(pos.coords.latitude), lon=Number(pos.coords.longitude);
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,precipitation,rain,showers&timezone=auto`;
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error('weather_http_'+r.status);
      const j=await r.json(); const c=j.current||{}; const code=Number(c.weather_code||0);
      const precipitation=Number(c.precipitation||0), rainMm=Number(c.rain||0), showersMm=Number(c.showers||0);
      const rainCodes=[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99];
      const rainy=rainCodes.includes(code) || precipitation>0 || rainMm>0 || showersMm>0;
      const windy=Number(c.wind_speed_10m||0)>=30;
      const icon=rainy?'🌧️':windy?'💨':code===0?'☀️':'🌤️';
      const title=rainy?'Está chovendo! A aventura de hoje é dentro de casa.':windy?'Vento forte: melhor uma aventura protegida.':code===0?'O dia está lindo lá fora!':'O dia está gostoso para descobrir coisas';
      const weatherDetail=rainy
        ? `Chuva detectada${precipitation>0?` · ${precipitation.toFixed(1)} mm`:''}`
        : `Sem chuva agora${precipitation>0?` · ${precipitation.toFixed(1)} mm`:''}`;
      const checkedAt=c.time?new Date(c.time).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      box.innerHTML=`<div class="weather-main"><div class="weather-icon">${icon}</div><div><div class="weather-temp">${Math.round(Number(c.temperature_2m||0))}°C</div><div class="weather-copy">Como está aí fora, Maria? 👀</div></div></div><div class="weather-question"><strong>Está chovendo aí?</strong><span>A previsão ajuda, mas quem está aí é você. 💜</span></div><div class="weather-actions"><button data-act="weatherChoice" data-choice="in">☔ Sim, está chovendo</button><button data-act="weatherChoice" data-choice="out">🌤️ Não, está tranquilo</button></div><div class="weather-status">🌡️ ${Math.round(Number(c.temperature_2m||0))}°C · Vento: ${Math.round(Number(c.wind_speed_10m||0))} km/h · consultado às ${checkedAt}. <button data-act="weather" style="border:0;background:transparent;color:#7d2bd5;font-weight:900;padding:0">Atualizar</button></div>`;
    }catch(e){box.innerHTML='<div class="weather-status">Não consegui consultar o clima agora. Tente “Atualizar” novamente. 💜</div>';
    }
  },err=>{
    const msg=err&&err.code===1?'A localização foi bloqueada. Permita a localização para o clima ficar certinho.':err&&err.code===3?'A localização demorou demais. Toque em “Atualizar” para tentar novamente.':'Não foi possível acessar a localização. Você pode escolher uma atividade dentro ou fora de casa.';
    box.innerHTML=`<div class="weather-status">${msg}</div>`;
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
}

      commit(s=>{s.savings[k]=Math.round((s.savings[k]-v)*100)/100;s.savingsLog.push({kid:k,date:today,value:-v,note:n})}); toast("Retirada registrada"); break;}
    case "saveAdult":{const n=$("#aName").value.trim(); if(!n){toast("O nome não pode ficar vazio.");return}
      commit(s=>{s.adults[me].name=n;s.adults[me].pin=$("#aPin").value.trim()}); toast("Perfil salvo"); break;}
    case "openReader": openReader(me,b.dataset.id); break;
    case "markPage":{const inp=$("#pg-"+b.dataset.id), v=parseInt(inp&&inp.value)||0; if(!v){toast("Escreva a página.");return}
      commit(s=>{s.progress[me]=s.progress[me]||{};s.progress[me][b.dataset.id]={...(s.progress[me][b.dataset.id]||{}),page:v,ts:now}}); toast(`Marcado: página ${v} 📍`); break;}
    case "setBookFile": commit(s=>{const bk=s.books.find(x=>x.id===b.dataset.id); if(bk) bk.file=($("#bf-"+b.dataset.id).value||"").trim()}); toast("Arquivo salvo"); break;
    case "delPhoto": commit(s=>delete s.photos[b.dataset.id]); toast("Foto removida"); break;
    case "saveSettings": commit(s=>{s.settings.monthlyMax=parseFloat($("#sMax").value)||0;s.settings.completeBonus=parseInt($("#sCB").value)||0;s.settings.greatScreenPct=parseInt($("#sGS").value)||0}); toast("Salvo"); break;
    case "export":{const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`casa-em-dia-backup-${dkey()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); break;}
  }
  // marcar como lidas as mensagens do casal ao abrir a aba
});
function markSeen(){
  if(!state||!isAdult(view.who)||view.open!==view.who&&state.adults[view.who].pin) return;
  if(view.ptab==="nos"){const unseen=state.couple.msgs.some(m=>m.from!==view.who&&!m.seen); if(unseen){state.couple.msgs.forEach(m=>{if(m.from!==view.who)m.seen=true});persist()}}
}
const _render=render; render=function(){_render();markSeen()};
let phoneReminderTimer=null;
function phoneReminderTick(){
  if(!view||!view.open||!isKid(view.who)) return;
  const k=view.who, d=new Date(), dow=d.getDay();
  if(dow===5||dow===6) return;
  const cut=state.kids[k].screenCutoff||"20:00"; const [hh,mm]=cut.split(":").map(Number);
  const mins=d.getHours()*60+d.getMinutes(), target=hh*60+mm, diff=target-mins;
  const key=`${dkey()}-${k}-${diff}`;
  const msg=diff===20?"📱 Faltam 20 minutos para guardar o celular.":diff===10?"📱 Faltam 10 minutos. Já vai se preparando.":diff===5?"📱 Últimos 5 minutos!":diff===0?"🌙 Chegou a hora de deixar o celular descansar.":null;
  if(msg && window.__phoneReminderKey!==key){window.__phoneReminderKey=key;toast(msg); if(typeof speakMaria==='function'&&k==='k1'&&diff<=5) speakMaria(msg);}
}
if(!phoneReminderTimer) phoneReminderTimer=setInterval(phoneReminderTick,30000);
function fieldInput(e){
  const fd=e.target.dataset.f; if(!fd) return false;
  const [f,k]=fd.split(":"); const v=e.target.type==="checkbox"?e.target.checked:e.target.value;
  if(F(f)[k]!==v){F(f)[k]=v; if(e.target.tagName==="SELECT") render()}
  return true;
}
document.addEventListener("input",e=>{fieldInput(e)});
function resizeImage(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image(); img.onload=()=>{
    const sc=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",.78))};
    img.onerror=()=>toast("Não consegui abrir essa imagem."); img.src=r.result};
  r.readAsDataURL(file);
}
function resizePhoto(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image(); img.onload=()=>{
    const S=320, c=document.createElement("canvas"); c.width=S; c.height=S;
    const m=Math.min(img.width,img.height);
    // Enquadramento automático: em fotos verticais, sobe o recorte para
    // preservar melhor rosto/cabeça; em paisagens, mantém o centro.
    const extraY=Math.max(0,img.height-m);
    const extraX=Math.max(0,img.width-m);
    const sx=extraX/2;
    const sy=extraY>0 ? Math.min(extraY, extraY*0.22) : 0;
    c.getContext("2d").drawImage(img,sx,sy,m,m,0,0,S,S);
    cb(c.toDataURL("image/jpeg",.84))};
    img.onerror=()=>toast("Não consegui abrir essa imagem."); img.src=r.result};
  r.readAsDataURL(file);
}
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.creativephoto){const file=e.target.files[0]; if(!file) return;
    resizeImage(file,560,url=>{F('creative').photo=url; render(); toast("Foto pronta. Agora é só salvar 💜")}); return}
  if(e.target.dataset&&e.target.dataset.photo){const id=e.target.dataset.photo, file=e.target.files[0]; if(!file) return;
    resizePhoto(file,url=>{commit(s=>s.photos[id]=url); toast("Foto salva 📷")}); return}
  if(e.target.dataset&&e.target.dataset.routine){
    const k=e.target.dataset.kid,m=e.target.dataset.routine,i=+e.target.dataset.index,f=e.target.dataset.field;
    if(state.routines&&state.routines[k]&&state.routines[k][m]&&state.routines[k][m][i]){state.routines[k][m][i][f]=e.target.value; persist();}
    return;
  }
  if(e.target.dataset&&e.target.dataset.routineSetting){
    const k=e.target.dataset.kid,f=e.target.dataset.routineSetting,v=e.target.value;
    state.routines[k][f]=f==='bathTarget'?Number(v):v; if(f==='screenCutoff'){ state.kids[k].screenCutoff=v; kidList().forEach(x=>{state.kids[x].screenCutoff=v; state.routines[x]=state.routines[x]||{}; state.routines[x].screenCutoff=v;}); } persist(); toast('Combinado do celular salvo para Maria e João 💜'); return;
  }
  if(fieldInput(e)) return;
  if(e.target.id!=="importFile"||!e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.kids||!d.tasks) throw 0;
    if(confirm("Substituir os dados deste aparelho pelo backup?")){state=migrate(d);ensureRoutines(state);persist();render();toast("Backup restaurado")}}
    catch(err){toast("Esse arquivo não é um backup do Casa em Dia.")}};
  r.readAsText(e.target.files[0]);
});

/* ============================================================
   LEITOR DE PDF (livros guardados na pasta "livros" do GitHub)
   ============================================================ */
let RD=null; // {kid,book,doc,page,total,scale,start,startPage,rendering}
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res,rej)=>{const sc=document.createElement("script"); sc.src=PDFJS+"pdf.min.js";
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";res(window.pdfjsLib)}; sc.onerror=rej; document.head.appendChild(sc)});
}
function readerShell(title){
  let ov=$("#reader"); if(!ov){ov=document.createElement("div");ov.id="reader";document.body.appendChild(ov)}
  ov.innerHTML=`<div class="rd-top"><button class="btn small ghost" data-rd="close">✕ Fechar</button><div class="rd-title">${esc(title)}</div><span class="rd-page" id="rdPage"></span></div>
    <div class="rd-body" id="rdBody"><p class="muted" id="rdMsg" style="text-align:center;margin-top:40px;font-weight:700">Abrindo o livro…</p><canvas id="rdCanvas"></canvas></div>
    <div class="rd-bottom"><button class="btn" data-rd="prev" aria-label="Página anterior">◀</button>
      <button class="btn small ghost" data-rd="zoomout" aria-label="Diminuir">A−</button><button class="btn small ghost" data-rd="zoomin" aria-label="Aumentar">A+</button>
      <button class="btn" data-rd="next" aria-label="Próxima página">▶</button></div>`;
  document.body.classList.add("reading");
}
async function openReader(kid,bookId){
  const book=state.books.find(b=>b.id===bookId); if(!book) return;
  const p=progOf(kid,bookId)||{};
  RD={kid,book,doc:null,page:p.page||1,total:p.total||0,scale:1,start:Date.now(),startPage:p.page||1};
  readerShell(book.title);
  try{
    const lib=await loadPdfJs();
    RD.doc=await lib.getDocument(bookFile(book)).promise;
    RD.total=RD.doc.numPages; if(RD.page>RD.total) RD.page=1;
    $("#rdMsg").remove(); await renderReaderPage();
    if(p.page>1) toast(`Continuando da página ${p.page} 📍`);
  }catch(err){
    const m=$("#rdMsg"); if(m) m.innerHTML=`Não consegui abrir o arquivo <b>${esc(bookFile(book))}</b>.<br>Confira se o PDF está na pasta <b>livros</b> do GitHub com esse nome, e se o celular está com internet.`;
  }
}
async function renderReaderPage(){
  if(!RD||!RD.doc||RD.rendering) return; RD.rendering=true;
  try{
    const page=await RD.doc.getPage(RD.page), body=$("#rdBody"), cv=$("#rdCanvas");
    const base=page.getViewport({scale:1}), fit=(body.clientWidth-16)/base.width, scale=fit*RD.scale, dpr=window.devicePixelRatio||1;
    const vp=page.getViewport({scale:scale*dpr});
    cv.width=vp.width; cv.height=vp.height; cv.style.width=(vp.width/dpr)+"px"; cv.style.height=(vp.height/dpr)+"px";
    await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    $("#rdPage").textContent=`${RD.page} / ${RD.total}`; body.scrollTop=0;
    state.progress[RD.kid]=state.progress[RD.kid]||{};
    state.progress[RD.kid][RD.book.id]={page:RD.page,total:RD.total,ts:Date.now()}; persist();
  }finally{RD.rendering=false}
}
function closeReader(){
  if(!RD) return; const r=RD; RD=null;
  const ov=$("#reader"); if(ov) ov.remove(); document.body.classList.remove("reading");
  const mins=Math.max(1,Math.round((Date.now()-r.start)/60000)), pages=Math.max(0,r.page-r.startPage);
  if(Date.now()-r.start>60000){
    view.tab="leitura"; view.f.read={book:r.book.title,minutes:String(mins),pages:pages?String(pages):"",finished:r.total&&r.page>=r.total};
    render(); toast(`Você leu ${mins} min. Conte o que aconteceu e salve a leitura!`); window.scrollTo(0,0);
  } else render();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-rd]"); if(!b||!RD) return;
  const a=b.dataset.rd;
  if(a==="close") closeReader();
  else if(a==="next"&&RD.page<RD.total){RD.page++;renderReaderPage()}
  else if(a==="prev"&&RD.page>1){RD.page--;renderReaderPage()}
  else if(a==="zoomin"){RD.scale=Math.min(2.5,RD.scale+.25);renderReaderPage()}
  else if(a==="zoomout"){RD.scale=Math.max(.75,RD.scale-.25);renderReaderPage()}
});
document.addEventListener("keydown",e=>{ if(!RD) return;
  if(e.key==="ArrowRight"&&RD.page<RD.total){RD.page++;renderReaderPage()}
  else if(e.key==="ArrowLeft"&&RD.page>1){RD.page--;renderReaderPage()}
  else if(e.key==="Escape") closeReader();
});
let tx=null;
document.addEventListener("touchstart",e=>{if(RD&&e.target.closest("#rdBody")&&RD.scale<=1) tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(!RD||tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(dx<-60&&RD.page<RD.total){RD.page++;renderReaderPage()} else if(dx>60&&RD.page>1){RD.page--;renderReaderPage()}},{passive:true});

/* ---------- início ---------- */
state=migrate(loadLocal()); if(state){ensureRoutines(state); persist();}
$("#saveState").textContent="Os dados ficam salvos neste aparelho. Faça um backup de vez em quando em Mês e ajustes.";
render();
</script>
